[project]
name = "run2025"
version = "0.1.0"
description = "Turning Strava Stats into a Poster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "drawsvg>=2.4.1",
    "fire>=0.7.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "seaborn>=0.13.2",
    "tzdata>=2026.2",
]


[tool.ruff]
line-length = 100
target-version = "py310"
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "W",   # ?
  "N",   # ?
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["runposter"]
